[project]
name = "mvp-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MANOJBHARATHII", email = "manojbhaarathii@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.5.2",
    "langchain-groq>=1.2.1",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
mvp-rag = "mvp_rag:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
